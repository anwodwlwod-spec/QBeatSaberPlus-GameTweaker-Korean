name: Quest OS font runtime diagnostic

on:
  push:
    branches: [ chatgpt-font-debug ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3
        with:
          version: 1.10.0

      - name: Create ndkpath.txt
        shell: bash
        run: |
          echo "$ANDROID_NDK_HOME" > "$GITHUB_WORKSPACE/ndkpath.txt"

      - name: Setup qpm
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          cache: true
          resolve_ndk: true

      - name: Inject OS font runtime diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/UI/SettingsMainView.cpp')
          s = p.read_text(encoding='utf-8')

          marker = '    static std::u16string ToU16Number(std::size_t p_Value)\n'
          fn = r'''    /// @brief Inspect Quest / Android OS fonts without modifying any TMP font asset.
    static void LogQuestOSKoreanFonts()
    {
        static bool s_HasRun = false;
        if (s_HasRun)
            return;
        s_HasRun = true;

        try
        {
            auto l_ToU16 = [](std::size_t p_Value) {
                const auto l_Value = std::to_string(p_Value);
                return std::u16string(l_Value.begin(), l_Value.end());
            };

            Logger::Instance->Info(u"[OSFontDiag] ===== Quest OS font scan start =====");
            auto l_Names = UnityEngine::Font::GetOSInstalledFontNames();

            std::u16string l_Count = u"[OSFontDiag] Installed font names=";
            l_Count += l_ToU16(static_cast<std::size_t>(l_Names.size()));
            Logger::Instance->Info(l_Count);

            int l_Candidates = 0;
            for (auto l_Name : l_Names)
            {
                auto l_Font = UnityEngine::Font::CreateDynamicFontFromOSFont(l_Name, 48);
                if (!l_Font)
                    continue;

                const bool a = l_Font->HasCharacter(u'룹');
                const bool b = l_Font->HasCharacter(u'콤');
                const bool c = l_Font->HasCharacter(u'밝');
                const bool d = l_Font->HasCharacter(u'홍');
                const bool e = l_Font->HasCharacter(u'죽');

                if (!(a || b || c || d || e))
                    continue;

                std::u16string l_Message = u"[OSFontDiag] Font=";
                l_Message += l_Name;
                l_Message += u" | 룹="; l_Message += a ? u"1" : u"0";
                l_Message += u" 콤="; l_Message += b ? u"1" : u"0";
                l_Message += u" 밝="; l_Message += c ? u"1" : u"0";
                l_Message += u" 홍="; l_Message += d ? u"1" : u"0";
                l_Message += u" 죽="; l_Message += e ? u"1" : u"0";
                Logger::Instance->Info(l_Message);

                if (a && b && c && d && e)
                {
                    ++l_Candidates;
                    std::u16string l_Full = u"[OSFontDiag] FULL_CANDIDATE=";
                    l_Full += l_Name;
                    Logger::Instance->Info(l_Full);
                }
            }

            std::u16string l_End = u"[OSFontDiag] Full candidates=";
            l_End += l_ToU16(static_cast<std::size_t>(l_Candidates));
            Logger::Instance->Info(l_End);
            Logger::Instance->Info(u"[OSFontDiag] ===== Quest OS font scan end =====");
        }
        catch (const std::exception& l_Exception)
        {
            Logger::Instance->Error(u"[OSFontDiag] Scan failed:");
            Logger::Instance->Error(l_Exception);
        }
    }

'''
          if marker not in s:
              raise SystemExit('insertion marker not found')
          s = s.replace(marker, fn + marker, 1)

          call_marker = '        /// Diagnostics only. These calls do not change the UI font.\n'
          call = '        LogQuestOSKoreanFonts();\n\n'
          if call_marker not in s:
              raise SystemExit('call marker not found')
          s = s.replace(call_marker, call_marker + call, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build and create QMOD
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          qpm s qmod

      - name: Upload diagnostic QMOD
        uses: actions/upload-artifact@v4
        with:
          name: QBeatSaberPlus-GameTweaker-OSFontDiag.qmod
          path: ./QBeatSaberPlus-GameTweaker.qmod
          if-no-files-found: error
