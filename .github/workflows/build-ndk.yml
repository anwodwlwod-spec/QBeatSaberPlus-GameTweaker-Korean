name: NDK build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  module_id: qbeatsaberplus-gametweaker
  qmodName: QBeatSaberPlus-GameTweaker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Create ndkpath.txt
        run: |
          echo "$ANDROID_NDK_HOME" > "$GITHUB_WORKSPACE/ndkpath.txt"
          cat "$GITHUB_WORKSPACE/ndkpath.txt"

      - name: Setup qpm
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          qpm_version: version@^1.0.0
          restore: true
          cache: true
          resolve_ndk: true
          publish: false
          qpm_qmod: ${{ env.qmodName }}.qmod

      - name: Print runtime font APIs
        shell: bash
        run: |
          echo "===================================================="
          echo "SEARCH TARGET FILES"
          echo "===================================================="

          find extern -type f \(             -path '*/UnityEngine/Font.hpp' -o             -path '*/TMPro/TMP_FontAsset.hpp'           \) -print | sort || true

          echo ""
          echo "===================================================="
          echo "UNITYENGINE FONT API MATCHES"
          echo "===================================================="

          grep -RIn             --include='Font.hpp'             -E 'CreateDynamicFontFromOSFont|GetOSInstalledFontNames|CreateFont|Font::'             extern | head -500 || true

          echo ""
          echo "===================================================="
          echo "TMP FONT ASSET API MATCHES"
          echo "===================================================="

          grep -RIn             --include='TMP_FontAsset.hpp'             -E 'CreateFontAsset|TryAddCharacters|HasCharacter|AtlasPopulationMode|sourceFontFile|fallbackFontAssetTable'             extern | head -800 || true

          echo ""
          echo "===================================================="
          echo "PRINT UnityEngine Font.hpp"
          echo "===================================================="

          while IFS= read -r file; do
            echo ""
            echo "####################################################"
            echo "FILE: $file"
            echo "####################################################"
            sed -n '1,350p' "$file"
          done < <(find extern -type f -path '*/UnityEngine/Font.hpp' | sort)

          echo ""
          echo "===================================================="
          echo "PRINT TMPro TMP_FontAsset.hpp"
          echo "===================================================="

          while IFS= read -r file; do
            echo ""
            echo "####################################################"
            echo "FILE: $file"
            echo "####################################################"
            sed -n '1,500p' "$file"
          done < <(find extern -type f -path '*/TMPro/TMP_FontAsset.hpp' | sort)

      - name: Build and create QMOD
        run: |
          cd "$GITHUB_WORKSPACE"
          qpm s qmod

      - name: Get library name
        id: libname
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build"
          shopt -s nullglob
          files=(lib${module_id}*.so)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No compiled .so file found."
            exit 1
          fi
          echo "NAME=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload release library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.libname.outputs.NAME }}
          path: ./build/${{ steps.libname.outputs.NAME }}
          if-no-files-found: error

      - name: Upload debug library
        uses: actions/upload-artifact@v4
        with:
          name: debug_${{ steps.libname.outputs.NAME }}
          path: ./build/debug/${{ steps.libname.outputs.NAME }}
          if-no-files-found: error

      - name: Upload QMOD
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.qmodName }}.qmod
          path: ./${{ env.qmodName }}.qmod
          if-no-files-found: error
