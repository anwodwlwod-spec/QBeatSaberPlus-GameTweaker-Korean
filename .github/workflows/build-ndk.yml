name: Build NDK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup QPM
        uses: Fernthedev/qpm-action@v1
        with:
          restore: true
          cache: true

      - name: Show extern contents
        run: |
          echo "===================================================="
          echo "EXTERN DIRECTORY"
          echo "===================================================="
          find extern -maxdepth 5 -type f | sort || true

          echo ""
          echo "===================================================="
          echo "XUITEXT"
          echo "===================================================="
          grep -R "class XUIText" extern || true
          grep -R "XUIText" extern || true

          echo ""
          echo "===================================================="
          echo "TMP_FONTASSET"
          echo "===================================================="
          grep -R "TMP_FontAsset" extern || true

          echo ""
          echo "===================================================="
          echo "TEXTMESHPRO"
          echo "===================================================="
          grep -R "TextMeshPro" extern || true

          echo ""
          echo "===================================================="
          echo "FONT"
          echo "===================================================="
          grep -R "font" extern | head -300 || true

      - name: Build and create QMOD
        run: |
          cd "$GITHUB_WORKSPACE"
          qpm s qmod

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: |
            build/**/*.so
            *.qmod
