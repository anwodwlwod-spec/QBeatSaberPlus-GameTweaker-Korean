name: NDK build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  module_id: qbeatsaberplus-gametweaker
  qmodName: QBeatSaberPlus-GameTweaker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Create ndkpath.txt
        run: |
          echo "$ANDROID_NDK_HOME" > "$GITHUB_WORKSPACE/ndkpath.txt"
          cat "$GITHUB_WORKSPACE/ndkpath.txt"

      - name: Setup qpm
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          qpm_version: version@^1.0.0
          restore: true
          cache: true
          resolve_ndk: true
          publish: false
          qpm_qmod: ${{ env.qmodName }}.qmod

      - name: Print XUIText and text component headers
        shell: bash
        run: |
          echo "===================================================="
          echo "XUIText.hpp"
          echo "===================================================="
          XUI_TEXT="extern/includes/chatplex-sdk-bs/shared/CP_SDK/XUI/XUIText.hpp"

          if [ -f "$XUI_TEXT" ]; then
            sed -n '1,260p' "$XUI_TEXT"
          else
            echo "XUIText.hpp not found at expected path."
            echo "Searching..."
            find extern -type f -name 'XUIText.hpp' -print
          fi

          echo ""
          echo "===================================================="
          echo "Related text headers"
          echo "===================================================="

          find extern/includes/chatplex-sdk-bs/shared/CP_SDK             -type f             \( -iname '*text*.hpp' -o -iname '*font*.hpp' \)             -print | sort

          echo ""
          echo "===================================================="
          echo "CText-related matches"
          echo "===================================================="

          grep -RIn             --include='*.hpp'             --include='*.h'             --include='*.cpp'             -E 'class CText|CText::|TMP_Text|TextMeshProUGUI|SetFont|set_font|get_font'             extern/includes/chatplex-sdk-bs/shared/CP_SDK             | head -500 || true

      - name: Build and create QMOD
        run: |
          cd "$GITHUB_WORKSPACE"
          qpm s qmod

      - name: Get library name
        id: libname
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build"
          shopt -s nullglob
          files=(lib${module_id}*.so)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No compiled .so file found."
            exit 1
          fi
          echo "NAME=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload release library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.libname.outputs.NAME }}
          path: ./build/${{ steps.libname.outputs.NAME }}
          if-no-files-found: error

      - name: Upload debug library
        uses: actions/upload-artifact@v4
        with:
          name: debug_${{ steps.libname.outputs.NAME }}
          path: ./build/debug/${{ steps.libname.outputs.NAME }}
          if-no-files-found: error

      - name: Upload QMOD
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.qmodName }}.qmod
          path: ./${{ env.qmodName }}.qmod
          if-no-files-found: error
