name: Font API diagnostic

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  inspect-font-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - name: Create ndkpath.txt
        shell: bash
        run: |
          echo "$ANDROID_NDK_HOME" > "$GITHUB_WORKSPACE/ndkpath.txt"

      - name: Setup qpm
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          qpm_version: version@^1.0.0
          restore: true
          cache: true
          resolve_ndk: true

      - name: Inspect generated Unity Font APIs
        shell: bash
        run: |
          echo "===================================================="
          echo "FONT-RELATED GENERATED HEADERS"
          echo "===================================================="
          find extern -type f \( \
            -path '*/UnityEngine/Font.hpp' -o \
            -path '*/UnityEngine/zzzz__Font*.hpp' -o \
            -path '*/TMPro/TMP_FontAsset.hpp' -o \
            -path '*/TMPro/zzzz__TMP_FontAsset*.hpp' \
          \) -print | sort || true

          echo
          echo "===================================================="
          echo "OS / DYNAMIC FONT API MATCHES"
          echo "===================================================="
          grep -RIn \
            --include='*.hpp' \
            -E 'GetOSInstalledFontNames|CreateDynamicFontFromOSFont|CreateFont|HasCharacter|RequestCharactersInTexture|sourceFontFile|set_sourceFontFile|atlasPopulationMode|set_atlasPopulationMode|TryAddCharacters|CreateFontAsset' \
            extern/includes extern/headers 2>/dev/null | head -1200 || true

          echo
          echo "===================================================="
          echo "PRINT GENERATED UnityEngine Font HEADERS"
          echo "===================================================="
          while IFS= read -r file; do
            echo
            echo "####################################################"
            echo "FILE: $file"
            echo "####################################################"
            sed -n '1,500p' "$file"
          done < <(find extern -type f \( -path '*/UnityEngine/Font.hpp' -o -path '*/UnityEngine/zzzz__Font*.hpp' \) | sort)

          echo
          echo "===================================================="
          echo "PRINT GENERATED TMP_FontAsset HEADERS (relevant lines)"
          echo "===================================================="
          grep -RIn \
            --include='zzzz__TMP_FontAsset*.hpp' \
            -E 'sourceFontFile|atlasPopulationMode|TryAddCharacters|CreateFontAsset|set_' \
            extern 2>/dev/null | head -1200 || true
